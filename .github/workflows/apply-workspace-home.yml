name: Apply workspace-home composition

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply composition patch
        run: python3 scripts/patch-workspace-home.py

      - name: Commit and push
        run: |
          git config user.name "b1o"
          git config user.email "erikghabuzyan6@gmail.com"
          git add frontend/app/page.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ui: composed workspace-home first-run layout with template quick-start"
          git push
