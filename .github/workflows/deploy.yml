name: Deploy Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/deploy.yml"
permissions:
  contents: read
jobs:
  deploy-worker:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter backend exec wrangler d1 migrations apply collab-docs-db --remote --env production --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm --filter backend deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  deploy-pages:
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    needs: [deploy-worker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Validate production frontend configuration
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_OIDC_AUTHORIZATION_URL: ${{ vars.NEXT_PUBLIC_OIDC_AUTHORIZATION_URL }}
          NEXT_PUBLIC_OIDC_TOKEN_URL: ${{ vars.NEXT_PUBLIC_OIDC_TOKEN_URL }}
          NEXT_PUBLIC_OIDC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_OIDC_CLIENT_ID }}
          NEXT_PUBLIC_OIDC_AUDIENCE: ${{ vars.NEXT_PUBLIC_OIDC_AUDIENCE }}
        run: |
          test -n "$NEXT_PUBLIC_API_URL" || { echo "Missing NEXT_PUBLIC_API_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_OIDC_AUTHORIZATION_URL" || { echo "Missing NEXT_PUBLIC_OIDC_AUTHORIZATION_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_OIDC_TOKEN_URL" || { echo "Missing NEXT_PUBLIC_OIDC_TOKEN_URL"; exit 1; }
          test -n "$NEXT_PUBLIC_OIDC_CLIENT_ID" || { echo "Missing NEXT_PUBLIC_OIDC_CLIENT_ID"; exit 1; }
          test -n "$NEXT_PUBLIC_OIDC_AUDIENCE" || { echo "Missing NEXT_PUBLIC_OIDC_AUDIENCE"; exit 1; }
      - run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_OIDC_AUTHORIZATION_URL: ${{ vars.NEXT_PUBLIC_OIDC_AUTHORIZATION_URL }}
          NEXT_PUBLIC_OIDC_TOKEN_URL: ${{ vars.NEXT_PUBLIC_OIDC_TOKEN_URL }}
          NEXT_PUBLIC_OIDC_CLIENT_ID: ${{ vars.NEXT_PUBLIC_OIDC_CLIENT_ID }}
          NEXT_PUBLIC_OIDC_REDIRECT_URI: ${{ vars.NEXT_PUBLIC_OIDC_REDIRECT_URI }}
          NEXT_PUBLIC_OIDC_SCOPES: ${{ vars.NEXT_PUBLIC_OIDC_SCOPES }}
          NEXT_PUBLIC_OIDC_AUDIENCE: ${{ vars.NEXT_PUBLIC_OIDC_AUDIENCE }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      - run: pnpm --filter backend exec wrangler pages deploy ../frontend/out --project-name collab-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
